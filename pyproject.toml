[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hs-uarena-decktracker"
version = "0.1.0"
description = "Lightweight Hearthstone Underground Arena log tracker"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
gui = ["PySide6>=6.7"]

[project.scripts]
hs-uarena = "hs_uarena_decktracker.cli:main"
hs-uarena-gui = "hs_uarena_decktracker.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
